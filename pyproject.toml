[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "sabctools"
version = "9.7.1"
description = "C implementations of functions for use within SABnzbd"
readme = "README.md"
authors = [
    {name = "Safihre", email = "safihre@sabnzbd.org"},
]
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE.md"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Usenet News",
]

[project.urls]
Homepage = "https://github.com/sabnzbd/sabctools/"
Source = "https://github.com/sabnzbd/sabctools/"
Issues = "https://github.com/sabnzbd/sabctools/issues"

[dependency-groups]
test = [
    "pytest",
    "chardet",
    "portend"
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "RUF",
    "UP",
    "C4"
]
ignore = [
    "E402",
    "E501",
    "E731",
    "RUF012",
    "RUF022",
    "RUF023",
    "UP015",
    "UP024",
    "UP031",
    "UP035",
    "UP045"
]

[tool.cibuildwheel]
skip = "*i686* *t-*"
test-skip = "*"

[tool.cibuildwheel.linux]
archs = ["native"]

[tool.cibuildwheel.macos]
archs = ["universal2"]
build = "cp314-*"

[tool.cibuildwheel.windows]
archs = ["native"]
build = "cp314-*"
# Skip wheel repair: SABnzbd already bundles the required runtime DLLs
repair-wheel-command = ""

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.15"
# Keep the CMake cache between builds, so an incremental rebuild does not
# reconfigure and recompile the vendored tree from scratch.
build-dir = "build/{wheel_tag}"
# CMakeLists.txt installs the package files explicitly; src/ is mostly C++.
wheel.packages = []
