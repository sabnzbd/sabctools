name: Tests and build wheels

on: [push, pull_request]
permissions: read-all

jobs:
  black:
    name: Black Code Formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install black
      - run: >
          black
          .
          --check
          --diff

  # Split per operating system so a wheel build waits only on its own tests,
  # rather than on the slowest cell of a combined 18-way matrix.
  tests_linux:
    name: Tests Linux
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest

  tests_windows:
    name: Tests Windows
    uses: ./.github/workflows/tests.yml
    with:
      os: windows-latest

  tests_macos:
    name: Tests macOS
    uses: ./.github/workflows/tests.yml
    with:
      os: macos-latest

  # No wheel job restores a build *tree*. These are what gets published, and a
  # build tree is not content-addressed - a stale one can be wrong rather than
  # merely unhelpful, and cibuildwheel wants a clean checkout in any case. A
  # fresh checkout has no build/, so every wheel is configured and linked from
  # scratch. Only the ccache store is carried in, which cannot go stale: a
  # changed source, flag or compiler simply misses.
  #
  # The ARM runners have no tests of their own, so they gate on the tests for
  # the same OS.
  wheels_linux:
    name: Wheels ${{ matrix.os }} ${{ matrix.linux_arch }}
    needs: tests_linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            linux_arch: x86_64
          - os: ubuntu-24.04-arm
            linux_arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/compiler-cache
        with:
          scope: wheels
          containers: true
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ./wheelhouse/*.whl
          name: Wheels ${{ matrix.os }} ${{ matrix.linux_arch }}

  wheels_windows:
    name: Wheels ${{ matrix.os }}
    needs: tests_windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-11-arm ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/msvc-ninja
      - uses: ./.github/actions/compiler-cache
        with:
          scope: wheels
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ./wheelhouse/*.whl
          name: Wheels ${{ matrix.os }}

  wheels_macos:
    name: Wheels macos-latest
    needs: tests_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/compiler-cache
        with:
          scope: wheels
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ./wheelhouse/*.whl
          name: Wheels macos-latest

      # The sdist needs building once, on any platform; it rides along here.
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build source distribution
        run: |
          pip install build
          python -m build --sdist
      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ./dist/*.tar.gz
          name: Source distribution

  publish:
    name: Publish release to GitHub and PyPI
    needs: [ wheels_linux, wheels_windows, wheels_macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'sabnzbd/sabctools'
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist/
          merge-multiple: true
      - name: Publish release to GitHub (gh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" ./dist/*.tar.gz \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
